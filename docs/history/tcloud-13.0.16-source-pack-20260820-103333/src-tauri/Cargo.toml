[package]
name = "tcloud"
version = "13.0.15"
description = "TCloud â€” armazenamento e sincronizaÃ§Ã£o de arquivos no Windows com Telegram como backend."
authors = ["TCloud Development"]
edition = "2021"



[lib]

name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
grammers-client = { git = "https://github.com/Lonami/grammers", rev = "d07f96f", features = ["proxy"] }
grammers-session = { git = "https://github.com/Lonami/grammers", rev = "d07f96f" }
grammers-mtsender = { git = "https://github.com/Lonami/grammers", rev = "d07f96f", features = ["proxy"] }
grammers-tl-types = { git = "https://github.com/Lonami/grammers", rev = "d07f96f" }
tokio = { version = "1", features = ["full"] }

tauri-plugin-store = "2"
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"
chrono = "0.4"
dirs = "6"
base64 = "0.22"
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
log = "0.4"
env_logger = "0.11"
actix-web = "4"
actix-cors = "0.7"
actix-files = "0.6"
actix-multipart = "0.7"
futures = "0.3"
bytes = "1"
async-stream = "0.3"
actix-rt = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2.10.1"
tauri-plugin-deep-link = "2"
tauri-plugin-clipboard-manager = "2"
rand = "0.9"
sha2 = "0.10"
bcrypt = "0.16"
constant_time_eq = "0.3"

# Crypto: AEAD, KDF, secret zeroization
chacha20poly1305 = "0.10"
argon2 = "0.5"
hkdf = "0.12"
hmac = "0.12"
zeroize = { version = "1", features = ["derive"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
sevenz-rust2 = "0.7"
path-clean = "1"
walkdir = "2"
sqlite = { version = "0.37.0", features = ["bundled"] }
notify = "8.2.0"
mp4parse = "0.17"
urlencoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "socks"] }
sysinfo = "0.30"
tokio-rustls = "0.26"
rustls = "0.23"
webpki-roots = "0.26"
pdf-extract = "0.12.0"

unrar = "0.5"
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61.3", features = ["ApplicationModel", "Foundation", "Storage", "Storage_Search", "Storage_Provider"] }


